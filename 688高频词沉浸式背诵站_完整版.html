function explain(w){let e=w.en.toLowerCase();let s={
"personal":"personal → 想象你抱着自己的东西喊：“这是我 personal 的！”＝私人的。",
"tie":"tie → 领带就是 tie；把两个人 tie 在一起，就有“联系”的感觉。",
"still":"still → 被按下暂停键，一动不动 still；到现在还这样，也叫“仍然”。",
"offer":"offer → 服务员把东西递给你：I offer it to you.＝我提供给你。",
"addition":"addition 里有 add＝加；东西加进来，就是增加。",
"success":"success → 死磕到底，最后终于 success！＝成功。",
"produce":"produce → 工厂不停 produce 东西＝生产；produce a result＝引起结果。",
"expect":"expect → “我 expect 你给我惊喜。”＝我期待/预料。",
"cause":"cause → What caused it?＝什么引起了它？所以 cause＝引起、原因。"};return s[e]||"离谱联想：把“"+w.en+"”和“"+w.zh+"”绑在一起。先建立直接反应，之后再熟悉词形。"}
